# Escenario `servicio_detenido` (Fase 7), en k3d para que la accion autorizada
# `restart_service` (rollout restart del Deployment, ver infra/acciones_k8s.py) lo
# pueda arreglar de verdad. Antes vivia en docker compose, fuera del alcance del agente.
#
# El servidor HTTP corre en segundo plano y el proceso principal es un loop de `sleep`:
# matar httpd por PID (scripts/fallas/servicio_detenido.sh) deja el contenedor vivo pero
# sin servir. El loop es necesario: en busybox `sleep` corre DENTRO del sh (applet
# nofork), el SIGCHLD de httpd al morir lo interrumpe y, sin loop, el sh termina con
# exit 0 y Kubernetes reinicia el contenedor solo (verificado: el escenario se autocuraba)
# -> Prometheus no puede scrapear -> up{job="checkout"} = 0. Kubernetes no lo reinicia
# solo (no hay liveness probe, a proposito): lo tiene que arreglar el agente.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: aiops-lab
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command:
            - sh
            - -c
            # /metrics: contenido valido para Prometheus; solo importa que responda.
            - >-
              mkdir -p /www &&
              printf '# TYPE checkout_up gauge\ncheckout_up 1\n' > /www/metrics &&
              { httpd -f -p 8080 -h /www & echo $! > /tmp/httpd.pid; } &&
              while :; do sleep 3600; done
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: aiops-lab
spec:
  type: NodePort
  selector:
    app: checkout
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081

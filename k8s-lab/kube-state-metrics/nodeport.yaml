# Service NodePort adicional (el oficial es headless, clusterIP: None): Prometheus
# corre en docker-compose, fuera del cluster, y necesita un puerto expuesto en los
# nodos para poder scrapear. k3d mapea este NodePort a un puerto del host via
# `k3d cluster edit --port-add` (ver docs/plan-aiops.md Fase 3 / README del laboratorio).
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics-nodeport
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      nodePort: 30080

# Workload de prueba para el escenario `pod_fallido` del catalogo (ver
# domain/aiops_core/catalogo.py). Al arrancar crea /tmp/ok; el readinessProbe lo lee.
# `make falla-pod` borra /tmp/ok dentro del pod -> el pod sigue existiendo pero queda
# NotReady (kube_pod_status_ready{condition="true"} = 0). Es una falla que la accion
# autorizada `recreate_pod` SI arregla: el pod nuevo arranca con /tmp/ok de nuevo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: aiops-lab
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.36
          # Logs (Loki, k8s-lab/promtail.yaml): como un servicio real, avisa cuando su
          # chequeo de salud empieza a fallar -- la evidencia que pide RB-003. Solo
          # loguea los CAMBIOS de estado (no una linea cada 2 s).
          command:
            - sh
            - -c
            - |
              touch /tmp/ok
              echo "INFO api: listo (chequeo de salud en /tmp/ok)"
              estado=ok
              while :; do
                if [ -f /tmp/ok ]; then
                  [ "$estado" = ok ] || { echo "INFO api: chequeo de salud recuperado"; estado=ok; }
                else
                  [ "$estado" = fallo ] || { echo "ERROR api: chequeo de salud fallando (falta /tmp/ok): el pod queda NotReady"; estado=fallo; }
                fi
                sleep 2
              done
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ok"]
            periodSeconds: 2
            failureThreshold: 1
          resources:
            requests:
              cpu: 10m
              memory: 16Mi

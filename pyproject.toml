[project]
name = "fw-agents"
version = "0.1.0"
description = "Plantilla delgada sobre LangChain Deep Agents para crear agentes de dominio por carpeta."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pin exacto: confirmado en PyPI 2026-09-28 (https://pypi.org/project/deepagents/), release 0.7.19 (2026-09-24).
    "deepagents==0.7.19",
    "pyyaml>=6.0,<7.0",
    # rag/: embeddings (OpenAI) + almacen vectorial (pgvector sobre el Postgres del compose).
    "openai>=1.50,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<0.4",
    # infra/: conectividad generica (ver infra/README.md).
    "redis>=5.0,<6.0",
    "qdrant-client>=1.19,<2.0",
    # Pin exacto confirmado en PyPI 2026-09-28: release 0.3.2 (2026-08-06).
    "langchain-mcp-adapters==0.3.2",
    "rq>=2.0,<3.0",
    "boto3>=1.35,<2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["agents/.*/evals"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "domain", "agents", "rag"]
markers = [
    "eval: casos de evaluacion de un agente (resultado conocido, no unit test puro)",
]

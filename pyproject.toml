[project]
name = "fw-agents"
version = "0.1.0"
description = "Plantilla delgada sobre LangChain Deep Agents para crear agentes de dominio por carpeta."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pin exacto: confirmado en PyPI 2026-09-28 (https://pypi.org/project/deepagents/), release 0.7.19 (2026-09-24).
    "deepagents==0.7.19",
    "pyyaml>=6.0,<7.0",
    # rag/: embeddings (OpenAI) + almacen vectorial (pgvector sobre el Postgres del compose).
    "openai>=1.50,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pgvector>=0.3,<0.4",
    # infra/: conectividad generica (ver infra/README.md).
    "redis>=5.0,<6.0",
    "qdrant-client>=1.19,<2.0",
    # Pin exacto confirmado en PyPI 2026-09-28: release 0.3.2 (2026-08-06).
    "langchain-mcp-adapters==0.3.2",
    "rq>=2.0,<3.0",
    "boto3>=1.35,<2.0",
    # Migraciones de aiops_incidentes/eventos_auditoria/kill_switch (Fase 1). Pin
    # exacto: version real resuelta por `uv add alembic` dentro del contenedor el
    # 2026-10-05, no adivinada (ver docs/open-questions.md).
    "alembic==1.20.0",
    # Checkpointer de LangGraph para reanudar las pausas de aprobacion (nivel 2,
    # Fase 1/2). Pin exacto confirmado en PyPI el 2026-10-05 (ver docs/open-questions.md)
    # y re-confirmado al instalar: resuelve sin conflictos con deepagents==0.7.19.
    "langgraph-checkpoint-postgres==3.1.2",
    # API HTTP del agente aiops (Fase 2, ver docs/plan-aiops.md): webhook de Grafana,
    # incidentes, aprobacion, kill switch, metricas. httpx ya lo trae openai/anthropic
    # como dependencia transitiva; se declara explicito porque TestClient de FastAPI
    # lo usa directo.
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    # Proveedores de LLM elegibles desde la UI (infra/llm_config.py). Anthropic y Google
    # ya vienen con deepagents. Versiones resueltas por `uv add` el 2026-10-06.
    "langchain-openai>=1.1.9",
    "langchain-deepseek>=1.1.0",
    # Cifrado de las API keys guardadas en Postgres (Fernet, AIOPS_SECRETS_KEY).
    "cryptography>=50.0.1",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# migrations/: boilerplate generado por `alembic revision` (Fase 1), no logica de
# negocio; igual que agents/*/evals no es codigo de produccion propio.
exclude = ["agents/.*/evals", "migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "domain", "agents", "rag"]
markers = [
    "eval: casos de evaluacion de un agente (resultado conocido, no unit test puro)",
]

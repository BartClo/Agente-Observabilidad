# Perfil del entorno dev de AI FACTORY (Docker Compose en la VM iafactory-dev).
# Fuente: informes de solo lectura del 2026-11-13 (reglas, series y etiquetas de Loki reales).
# Arranca en nivel 1 (solo observa, diagnostica y avisa): no hay ejecutor de Compose todavia.
version: 1
aprobado: false        # borrador: el responsable lo revisa y pone true + aprobado_por
aprobado_por: ""
entorno: dev
observabilidad:
  etiqueta_servicio: service
  etiqueta_logs: service       # Loki (X-Scope-OrgID ai-factory): service = nombre compose
# Cada regla trae el servicio en otra etiqueta, siempre con el nombre compose (rest-api):
# ContainerUnhealthy/Stopped en service_name; SyntheticProbeFailed y ServiceDown del blackbox en
# service; ServiceDown y AgentServiceDown en job. Orden: service_name antes que job, porque en las
# de contenedor job vale docker-healthcheck-exporter.
webhook:
  servicio: labels.service_name|labels.service|labels.job
consultas:
  # Scrape directo (job) o sonda del blackbox (service): sano si ambas responden.
  servicio_responde: 'min(up{job="$servicio"} or probe_success{service="$servicio"})'
  # docker-healthcheck-exporter: 1 sano, 0 unhealthy, -1 sin healthcheck.
  contenedor_sano: 'min(iafactory_infra_container_health_status{service_name="$servicio"})'
categorias:
  - id: servicio_caido
    nombre: Servicio sin respuesta
    alertas: [ServiceDown, AgentServiceDown, SyntheticProbeFailed]
    runbook: RB-001
    senal: {metrica: servicio_responde, operador: ">=", umbral: 1}
    accion: restart_service
    nivel: 1
  - id: contenedor_fallido
    nombre: Contenedor detenido o unhealthy
    alertas: [ContainerUnhealthy, ContainerStopped]
    runbook: RB-003
    senal: {metrica: contenedor_sano, operador: ">=", umbral: 1}
    accion: restart_service
    nivel: 1
# Fuera del catalogo a proposito (las atiende el investigador sin actuar): host, costo, LLM
# y SLO, porque no se arreglan reiniciando.
# Sin seccion kubernetes: dev corre en Compose. Sin namespaces permitidos, cualquier accion
# por Kubernetes se niega antes de llamar a la API.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://agent:agent@postgres:5432/agents}
    depends_on:
      postgres:
        condition: service_healthy
    tty: true
    stdin_open: true

  postgres:
    # pgvector/pgvector (no el postgres:16-alpine oficial): trae la extension
    # `vector` precompilada, la necesita rag/store.py.
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-agent}
      - POSTGRES_DB=${POSTGRES_DB:-agents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -d explicito: sin el, pg_isready se conecta a una base con el nombre del usuario
      # ("agent", que no existe) y llena el log de FATAL cada 2s.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agents}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Unico lugar donde se ejecuta codigo del agente QA. Sin red por defecto
  # y sin acceso a docker.sock. Se invoca puntualmente (`docker compose run sandbox ...`),
  # no arranca con `make run`.
  sandbox:
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
    network_mode: "none"
    profiles: ["sandbox"]

  # Opcional. Activar con COMPOSE_PROFILES=redis en .env. Cache/rate-limit/sesion
  # corta: infra generica, ningun agente la usa todavia (ver infra/README.md).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    profiles: ["redis"]

  # Opcional. Mismo profile "redis": COMPOSE_PROFILES=redis levanta redis + worker
  # juntos. Cola de trabajos generica (RQ): no define que trabajos existen, eso lo
  # decide quien encola (`infra/queue.py`). Ver infra/README.md.
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    # "default" para trabajos genericos futuros, "aiops" para el webhook de Grafana
    # (ver app/api.py: get_queue("aiops")).
    command: ["uv", "run", "rq", "worker", "--url", "${REDIS_URL:-redis://redis:6379/0}", "default", "aiops"]
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["redis"]

  # Opcional. Activar con COMPOSE_PROFILES=qdrant en .env. Vector store dedicado,
  # alternativa a pgvector (rag/) para quien necesite mas escala/features de
  # busqueda. Infra generica: ningun agente la usa todavia.
  qdrant:
    # Pin alineado con qdrant-client en pyproject.toml (protocolo cliente/servidor
    # debe ir en la misma minor). Ver docs/open-questions.md si se actualiza uno sin el otro.
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_data:/qdrant/storage
    profiles: ["qdrant"]

  # Opcional. Activar con COMPOSE_PROFILES=garage en .env. Almacenamiento de
  # objetos S3-compatible: infra generica, ningun agente lo usa todavia.
  # Garage (Apache-2.0, self-hosted) en vez de MinIO: la imagen oficial
  # minio/minio dejo de publicarse gratis en Docker Hub/quay.io desde
  # 2025-10-15 (paso a licencia AGPL solo-fuente/suscripcion).
  garage:
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Garage exige access key >=8 caracteres y secret key >=16.
      - GARAGE_DEFAULT_ACCESS_KEY=${S3_ACCESS_KEY:-agent-access-key}
      - GARAGE_DEFAULT_SECRET_KEY=${S3_SECRET_KEY:-agentagent-secret}
      - GARAGE_DEFAULT_BUCKET=${S3_DEFAULT_BUCKET:-default}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_data:/data
    profiles: ["garage"]

  # Opcional. Activar con COMPOSE_PROFILES=langfuse en .env.
  # TODO(verificar): version/receta oficial self-host de langfuse compatible solo-Postgres,
  # ver docs/open-questions.md.
  langfuse:
    image: langfuse/langfuse:2
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agents}
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme}
      - SALT=${LANGFUSE_SALT:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    profiles: ["langfuse"]

  # Opcional. Activar con COMPOSE_PROFILES=observability en .env. Laboratorio real de
  # la Fase 3 (ver docs/plan-aiops.md y k8s-lab/README.md): Prometheus + Grafana +
  # RabbitMQ + un servicio de prueba, mas la API real (app/api.py, Fase 2) para que
  # el webhook de Grafana tenga algo que golpear. El cluster k3d (pod_fallido) es
  # externo a compose: se crea con `k3d cluster create aiops-lab`, ver k8s-lab/.
  prometheus:
    # Pin exacto: version real usada y verificada en esta sesion (2026-10-05).
    image: prom/prometheus:v3.0.1
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Solo laboratorio local: permite ver dashboards sin loguearse. Nunca en una
      # instancia expuesta a una red que no sea localhost.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # Fase 5: permite el <iframe> de la UI del agente en un panel Text. RIESGO: con
      # esto cualquiera que pueda editar un dashboard puede inyectar HTML/JS. Aceptable
      # en este laboratorio local; en una instancia compartida usar un plugin de panel.
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    env_file:
      - .env
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

  # Escenario `cola_detenida`: plugin rabbitmq_prometheus (metrica nativa
  # rabbitmq_queue_consumers, la misma que ya asume infra/observabilidad.py).
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports:
      - "15672:15672" # UI de management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["observability"]

  # Escenario `disco_lleno`: node_exporter vigilando un volumen tmpfs de tamano fijo
  # (50MB, ver volume billing_disk abajo) -- real pero acotado, sin arriesgar el
  # disco del host. `make falla-disco` lo llena de verdad via disco-billing-tools
  # (mismo volumen compartido).
  node-exporter-billing:
    image: prom/node-exporter:v1.8.2
    volumes:
      - billing_disk:/data
    profiles: ["observability"]

  disco-billing-tools:
    image: alpine:3.20
    volumes:
      - billing_disk:/data
    command: ["sleep", "infinity"]
    profiles: ["observability"]

  # Escenario `certificado_por_vencer`: nginx con un certificado autofirmado que
  # vence pronto (docker/nginx/certs/, ver el README del laboratorio para
  # regenerarlo) y blackbox_exporter sondeandolo via HTTPS.
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    profiles: ["observability"]

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./docker/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    profiles: ["observability"]

  # API real (app/api.py, Fase 2) para que el webhook de Grafana tenga un destino.
  # Distinto del servicio `app` (ese es la consola interactiva de make shell/run).
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    working_dir: /workspace
    volumes:
      - .:/workspace
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://agent:agent@postgres:5432/agents}
      - AIOPS_PERSISTENCIA=postgres
    command: ["uv", "run", "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8010:8000" # 8000 ocupado por otros proyectos en esta maquina compartida
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["observability"]

  # Opcional. Activar con COMPOSE_PROFILES=traefik en .env. Reverse proxy hacia
  # `app`: ver el servicio `api` arriba (Fase 2) para la API real. Usa el provider
  # "file" de Traefik, no el provider "docker" (ese requiere montar docker.sock; ver
  # docker-compose.yml servicio app y regla del framework de no montarlo).
  traefik:
    image: traefik:v3.3
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "8080:80" # entrada http
      - "8081:8080" # dashboard, solo dev
    depends_on:
      - app
    profiles: ["traefik"]

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  garage_data:
  grafana_data:
  # tmpfs de tamano fijo (50MB): se puede llenar de verdad para probar
  # disco_lleno sin arriesgar el disco real del host.
  billing_disk:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=50m"

# Reglas Grafana-managed (no Prometheus/Alertmanager): Grafana evalua estas queries
# contra el datasource Prometheus y dispara el webhook el mismo (ver contact-points.yaml).
# alertname/labels siguen el catalogo (domain/aiops_core/catalogo.py).
apiVersion: 1

groups:
  - orgId: 1
    name: aiops-l1
    folder: aiops
    interval: 10s
    rules:
      - uid: aiops-service-down
        title: ServiceDown
        condition: umbral
        data:
          - refId: consulta
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-lab
            model:
              expr: up{job="checkout"}
              instant: true
              refId: consulta
          - refId: umbral
            datasourceUid: __expr__
            model:
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: umbral
        labels:
          alertname: ServiceDown
          service: checkout
          env: dev
          # alta, no critical: con critical la politica nunca deja actuar al agente
          # (domain/aiops_core/politicas.py), y ServiceDown es un candidato L1.
          severity: alta
        annotations:
          summary: "Servicio checkout caido (up < 1)"
        for: 10s
        noDataState: OK
        execErrState: Alerting

      - uid: aiops-pod-failed
        title: PodFailed
        condition: umbral
        data:
          - refId: consulta
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-lab
            model:
              expr: sum(kube_pod_status_ready{condition="true",pod=~"api-.*"})
              instant: true
              refId: consulta
          - refId: umbral
            datasourceUid: __expr__
            model:
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: umbral
        labels:
          alertname: PodFailed
          service: api
          env: dev
          severity: alta
        annotations:
          summary: "Pod api en el cluster k3d no esta ready"
        for: 10s
        noDataState: OK
        execErrState: Alerting

      - uid: aiops-queue-stalled
        title: QueueStalled
        condition: umbral
        data:
          - refId: consulta
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-lab
            model:
              expr: rabbitmq_queue_consumers
              instant: true
              refId: consulta
          - refId: umbral
            datasourceUid: __expr__
            model:
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: umbral
        labels:
          alertname: QueueStalled
          service: worker
          env: dev
          severity: media
        annotations:
          summary: "Sin consumidores activos en la cola"
        for: 10s
        noDataState: OK
        execErrState: Alerting

      - uid: aiops-disk-usage-high
        title: DiskUsageHigh
        condition: umbral
        data:
          - refId: consulta
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-lab
            model:
              expr: >-
                100 * max(1 - node_filesystem_avail_bytes{job="node-exporter-billing",mountpoint="/data"}
                / node_filesystem_size_bytes{job="node-exporter-billing",mountpoint="/data"})
              instant: true
              refId: consulta
          - refId: umbral
            datasourceUid: __expr__
            model:
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: gt, params: [85] }
              refId: umbral
        labels:
          alertname: DiskUsageHigh
          service: billing
          env: dev
          severity: alta
        annotations:
          summary: "Disco de billing (tmpfs 50MB) por encima del 85%"
        for: 10s
        noDataState: OK
        execErrState: Alerting

      - uid: aiops-cert-expiring-soon
        title: CertExpiringSoon
        condition: umbral
        data:
          - refId: consulta
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus-lab
            model:
              expr: (min(probe_ssl_earliest_cert_expiry{service="gateway"}) - time()) / 86400
              instant: true
              refId: consulta
          - refId: umbral
            datasourceUid: __expr__
            model:
              type: threshold
              expression: consulta
              conditions:
                - evaluator: { type: lt, params: [14] }
              refId: umbral
        labels:
          alertname: CertExpiringSoon
          service: gateway
          env: dev
          severity: media
        annotations:
          summary: "Certificado de gateway vence en menos de 14 dias"
        for: 10s
        noDataState: OK
        execErrState: Alerting

# Laboratorio de la Fase 3 (ver docs/plan-aiops.md). `up{job="<nombre>"}` es la
# metrica nativa de Prometheus (no necesita instrumentar nada): sirve directo para
# la categoria `servicio_detenido` del catalogo (domain/aiops_core/catalogo.py).
# Sin rule_files/alerting: las reglas de alerta las evalua Grafana directo contra
# este datasource (Grafana-managed alerting, no Alertmanager), ver
# docker/grafana/provisioning/alerting/.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # servicio_detenido: Deployment "checkout" en k3d (k8s-lab/workload-checkout.yaml),
  # expuesto por NodePort 30081. up=0 cuando httpd no responde. Vive en k3d (no en
  # compose) para que la accion restart_service del agente lo pueda arreglar.
  - job_name: checkout
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["host.docker.internal:30081"]
        labels: {service: checkout, env: dev}

  # pod_fallido: kube-state-metrics del cluster k3d (ver k8s-lab/), expuesto al host
  # por k3d via NodePort + `k3d cluster edit --port-add` (ver README del laboratorio).
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["host.docker.internal:30080"]
        labels: {service: api, env: dev}

  # El broker real (plugin rabbitmq_prometheus). Ya NO lleva service=worker: sus metricas
  # agregadas (0 consumidores) hacian que QueueStalled estuviera siempre en alerta. El
  # consumidor es el job de abajo.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: {service: rabbitmq, env: dev}

  # cola_detenida: consumidor simulado en k3d (k8s-lab/workload-queue-consumer.yaml),
  # NodePort 30082. Publica rabbitmq_queue_consumers{queue="worker"} como lo haria el plugin.
  - job_name: queue-consumer
    static_configs:
      - targets: ["host.docker.internal:30082"]
        labels: {service: worker, env: dev}

  # disco_lleno: node_exporter sobre el tmpfs de 50MB (billing_disk), no el disco
  # real del host. mountpoint "/data": ajustar AIOPS_DISK_MOUNTPOINT=/data al correr
  # el agente contra este laboratorio (ver infra/observabilidad.py).
  - job_name: node-exporter-billing
    static_configs:
      - targets: ["node-exporter-billing:9100"]
        labels: {service: billing, env: dev}

  # certificado_por_vencer: blackbox_exporter sondea el TLS de "gateway" (cert
  # autofirmado que vence pronto, ver docker/nginx/certs/).
  - job_name: blackbox-gateway
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://gateway/"]
        labels: {service: gateway, env: dev}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Metricas del propio agente (app/api.py /metrics): TRA, MTTR, incidentes por estado,
  # acciones. Las grafica el dashboard "AIOps" (Fase 5).
  - job_name: aiops-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

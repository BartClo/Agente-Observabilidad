# Laboratorio de la Fase 3 (ver docs/plan-aiops.md). `up{job="<nombre>"}` es la
# metrica nativa de Prometheus (no necesita instrumentar nada): sirve directo para
# la categoria `servicio_detenido` del catalogo (domain/aiops_core/catalogo.py).
# Sin rule_files/alerting: las reglas de alerta las evalua Grafana directo contra
# este datasource (Grafana-managed alerting, no Alertmanager), ver
# docker/grafana/provisioning/alerting/.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # servicio_detenido: up=0 cuando el contenedor "checkout" no responde. nginx no
  # expone /metrics (el path por defecto de Prometheus): se scrapea "/" (200 por
  # defecto en nginx) para que up=1 mientras el servicio este sano.
  - job_name: checkout
    # nginx sirve docker/nginx/metrics.txt como archivo estatico en /metrics (ver
    # volumes del servicio checkout): contenido valido para Prometheus, no mide
    # nada real -- solo importa que nginx responda (up=1) o no (up=0).
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["checkout:80"]
        labels: {service: checkout, env: dev}

  # pod_fallido: kube-state-metrics del cluster k3d (ver k8s-lab/), expuesto al host
  # por k3d via NodePort + `k3d cluster edit --port-add` (ver README del laboratorio).
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["host.docker.internal:30080"]
        labels: {service: api, env: dev}

  # cola_detenida: plugin rabbitmq_prometheus (metrica nativa, sin exporter aparte).
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
        labels: {service: worker, env: dev}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

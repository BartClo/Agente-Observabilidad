# Escenario `certificado_por_vencer`: certificado autofirmado que vence pronto
# (ver docker/nginx/certs/, generado con `openssl req -x509 ... -days 3`, no
# commiteado: regenerar con el comando del README del laboratorio).
server {
    listen 443 ssl;
    server_name gateway;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        return 200 'ok\n';
        add_header Content-Type text/plain;
    }
}

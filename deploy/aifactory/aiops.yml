# Agente AIOps como servicio de AI FACTORY. Se agrega al `include:` de docker-compose.yml de
# ai-factory-platform. Sin docker.sock (ADR-003): para actuar, el agente deja una solicitud
# en AIOPS_SOLICITUDES_HOST y la ejecuta el host (deploy/aifactory/ejecutor/README.md).
# Los valores salen de aiops.env (ver aiops.env.example); nunca se commitea con secretos.
x-aiops: &aiops
  # Rutas relativas a este archivo: el contexto es la raiz del repositorio.
  build:
    context: ../..
    dockerfile: docker/Dockerfile.app
  image: ${AIOPS_IMAGE:-aiops-agent:local}
  env_file: [aiops.env]
  environment:
    AIOPS_BACKEND: prometheus
    # Por defecto nivel 1 (observa, diagnostica y avisa). Para actuar: AIOPS_ACTIONS=compose,
    # AIOPS_AUTONOMY_LEVEL=3 en aiops.env, el nivel de cada categoria en el perfil y el
    # ejecutor del host instalado.
    AIOPS_ACTIONS: ${AIOPS_ACTIONS:-ninguna}
    AIOPS_AUTONOMY_LEVEL: ${AIOPS_AUTONOMY_LEVEL:-1}   # tope global; el perfil no lo supera
    AIOPS_ALLOWED_ENVS: ${AIOPS_ALLOWED_ENVS:-dev}
    AIOPS_SOLICITUDES_DIR: /solicitudes
    # Verificar hasta 90 s (lectura cada 10 s): el contenedor tarda en arrancar y Prometheus
    # scrapea cada 15 s. Con una sola lectura, un reinicio exitoso se leia como fallido.
    AIOPS_VERIFY_WINDOW_S: ${AIOPS_VERIFY_WINDOW_S:-90}
    AIOPS_VERIFY_INTERVAL_S: ${AIOPS_VERIFY_INTERVAL_S:-10}
    AIOPS_PERFIL: ${AIOPS_PERFIL:-/perfiles/aifactory-dev.yaml}
    AIOPS_PERSISTENCIA: postgres
    AIOPS_PROMETHEUS_URL: http://prometheus:9090
    AIOPS_LOKI_URL: http://loki:3100
    AIOPS_OBS_ORG_ID: ai-factory    # Loki con auth_enabled
    REDIS_URL: redis://ia-factory-aiops-redis:6379/0
    DATABASE_URL: postgresql://aiops:${AIOPS_DB_PASSWORD:?falta AIOPS_DB_PASSWORD}@ia-factory-aiops-db:5432/aiops
  volumes:
    - ../../perfiles:/perfiles:ro
    - ${AIOPS_SOLICITUDES_HOST:-/var/lib/aiops/solicitudes}:/solicitudes
  networks: [ia-factory-network]
  restart: unless-stopped

services:
  aiops-agent:
    <<: *aiops
    container_name: ia-factory-aiops-agent   # prefijo ia-factory- para que promtail lo recoja
    # Antes de servir: valida el perfil (uno sin aprobar o invalido detiene el arranque, en vez
    # de responder 500 a cada alerta) y migra la base (idempotente). `exec`: uvicorn queda como
    # proceso principal y recibe las senales de docker stop.
    command: ["sh", "-c", "python -c 'from infra import perfil; perfil.activo()' && alembic upgrade head && exec uvicorn app.api:app --host 0.0.0.0 --port 8000"]
    ports: ["127.0.0.1:8214:8000"]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      aiops-db: {condition: service_healthy}
      aiops-redis: {condition: service_healthy}

  aiops-worker:
    <<: *aiops
    container_name: ia-factory-aiops-worker
    command: ["sh", "-c", "python -m agents.aiops.arranque; exec rq worker --with-scheduler --url $$REDIS_URL default aiops"]
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      aiops-db: {condition: service_healthy}
      aiops-redis: {condition: service_healthy}
      aiops-agent: {condition: service_healthy}   # espera a que la api haya migrado la base

  aiops-redis:
    # Propio: el Redis de la plataforma usa allkeys-lru (puede expulsar cualquier clave) y la
    # cola del agente, los bloqueos y los enfriamientos no se pueden perder.
    image: redis:7.4-alpine
    container_name: ia-factory-aiops-redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes: [aiops-redis:/data]
    networks: [ia-factory-network]
    mem_limit: 96m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aiops-db:
    # Propia y pequena: no se confirmo pgvector en el Postgres de la plataforma.
    image: pgvector/pgvector:pg16
    container_name: ia-factory-aiops-db
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${AIOPS_DB_PASSWORD:?falta AIOPS_DB_PASSWORD}
    volumes: [aiops-db:/var/lib/postgresql/data]
    networks: [ia-factory-network]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aiops-db:
  aiops-redis:

networks:
  ia-factory-network:
    external: true
    # La red la crea el compose de la plataforma como <proyecto>_ia-factory-network y su
    # configuracion cita tres proyectos distintos. Confirmar con docker network ls.
    name: ${AIOPS_RED_PLATAFORMA:?falta AIOPS_RED_PLATAFORMA}
